<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Love You — Universo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="universe">

        <!-- Atmosfera romântica -->
        <div class="romance-vignette"></div>
        <div class="romance-glow romance-glow-one"></div>
        <div class="romance-glow romance-glow-two"></div>

        <!-- Chuva 3D de corações e "EU TE AMO" -->
        <div id="love-rain"></div>
        <div id="love-sparkles"></div>

        <!-- Fundo -->
        <div class="stars"></div>
        <div class="nebula nebula-one"></div>
        <div class="nebula nebula-two"></div>

        <!-- Estrelas geradas pelo JavaScript -->
        <div id="space"></div>

        <!-- Sistema central -->
        <section class="love-system">

            <!-- Órbita externa -->
            <div class="orbit orbit-one"></div>
            <div class="orbit orbit-two"></div>
            <div class="orbit orbit-three"></div>

            <!-- Coração -->
            <div class="heart">
                ❤
            </div>

            <!-- Texto -->
            <div class="Love_You">

                <span class="love-main">
                    I Love You
                </span>

                <span class="love-sub">
                    em todos os universos
                </span>

            </div>

        </section>

        <!-- Pequena mensagem -->
        <div class="message">
            <span>∞</span>
            <p>
                Se existissem infinitos universos,<br>
                eu escolheria você em todos eles.
            </p>
            <span>∞</span>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
